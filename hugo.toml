baseURL = 'https://yangshaw.github.io/'
locale = 'zh-cn'
title = 'The Silent'
author = 'Yang Shaw'
theme = 'hugo-theme-tokiwa'
hasCJKLanguage = true
enableRobotsTXT = true
disqusShortname = 'your-disqus-shortname'

[params]
description = ''
env = 'production'
useChineseFonts = true
fuse = true
mainSections = ['posts']
postDateFormat = '2006-01-02'
asideImage = '/img/hornet-bg.png'
asideImagePosition = 'aside' # aside | page-lower-left

[params.feeds]
  listMode = 'full'   # full | summary
  pageSize = 20

[params.social]
  github = 'https://github.com/YangShaw'
  mail = 'mailto:youngshawww@gmail.com'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 1

  # [[menu.main]]
  #   identifier = 'tags'
  #   name = 'Tags'
  #   url = '/tags/'
  #   weight = 2

  [[menu.main]]
    identifier = 'feeds'
    name = 'Feeds'
    url = '/feeds/'
    weight = 2

  [[menu.main]]
    identifier = 'notes'
    name = 'Notes'
    url = '/notes/'
    weight = 3

  [[menu.main]]
    identifier = 'categories'
    name = 'Categories'
    url = '/categories/'
    weight = 4

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 5

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[module]
  [[module.imports]]
    path = 'github.com/heyeshuang/hugo-theme-tokiwa'
